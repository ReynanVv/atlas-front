<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B1B3A"><title>Atlas — Fluxo integrado</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f4f6f8;color:#0B1B3A}button,input{font:inherit}
.top{height:76px;background:#0B1B3A;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}.brand{font-size:24px;font-weight:900;display:flex;align-items:center;gap:10px}.brand i{width:40px;height:40px;border-radius:12px;background:#B8E400;color:#0B1B3A;display:grid;place-items:center;font-style:normal}.logout{border:0;background:#182a4a;color:#fff;border-radius:10px;padding:9px 12px}
.login{min-height:100vh;background:#0B1B3A;color:#fff;display:grid;place-items:center;padding:24px}.login-box{width:min(720px,100%)}.pill{display:inline-block;background:#B8E400;color:#0B1B3A;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900}.login h1{font-size:clamp(42px,8vw,76px);line-height:1;margin:20px 0}.login h1 em{color:#B8E400;font-style:normal}.login p{color:#b8c0ca;line-height:1.6}.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:28px 0}.role{background:#17283c;color:#fff;border:1px solid #2b3e56;border-radius:18px;padding:20px;text-align:left}.role.active{border:2px solid #B8E400}.role strong{display:block;font-size:20px}.role span{color:#aeb8c3;font-size:12px}.authrow{display:flex;gap:10px}.authrow input{flex:1;height:52px;border:1px solid #33465e;background:#0f1d2e;color:#fff;border-radius:12px;padding:0 14px}.primary{border:0;background:#B8E400;color:#0B1B3A;border-radius:12px;padding:13px 18px;font-weight:900}.primary:disabled{opacity:.45}.secondary{border:1px solid #d8dde4;background:#fff;color:#0B1B3A;border-radius:12px;padding:11px 15px;font-weight:800}
.main{max-width:950px;margin:0 auto;padding:30px 18px 80px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end}.head h1{font-size:34px;margin:6px 0}.head p,.muted{color:#69737A}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0}.step{background:#fff;border:1px solid #d8dde4;border-radius:12px;padding:12px;font-size:12px;font-weight:800}.step.done{background:#B8E400;border-color:#B8E400}.panel{background:#fff;border:1px solid #d8dde4;border-radius:20px;padding:22px;margin:14px 0}.panel h2{margin:0 0 6px}.panel-title{display:flex;justify-content:space-between;gap:10px}.badge{background:#B8E400;color:#0B1B3A;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:900;white-space:nowrap}.notice{padding:12px 14px;border-radius:12px;margin:10px 0;font-weight:700}.ok{background:#e9ecf2}.err{background:#ffe7e5;color:#8c302b}.state{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;background:#f4f6f8;border-radius:12px;margin-top:14px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin:14px 0}.days button,.days span{height:48px;border:1px solid #d8dde4;border-radius:10px;background:#fff;color:#69737A;display:grid;place-items:center;font-weight:900}.days .active{background:#B8E400;color:#0B1B3A;border-color:#B8E400}.workout{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #e9ecf2;padding:14px 0}.workout small{display:block;color:#69737A;margin-top:3px}.exercise{border-top:1px solid #e9ecf2;padding:14px 0}.hidden{display:none}
@media(max-width:650px){.roles{grid-template-columns:1fr}.authrow{flex-direction:column}.steps{grid-template-columns:1fr 1fr}.head{align-items:flex-start;flex-direction:column}.workout{align-items:flex-start;flex-direction:column}.primary{width:100%}}
</style>
</head>
<body><div id="app"></div><script>/* live logic */</script></body></html>
